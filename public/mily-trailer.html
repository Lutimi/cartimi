const DURACION = 15;
const imagen = async (svg) => {
	const img = new Image();
	const url = URL.createObjectURL(new Blob([svg.replace("<svg", "<svg xmlns=\"http://www.w3.org/2000/svg\"")], { type: "image/svg+xml" }));
	try {
		await new Promise((ok, fail) => {
			img.onload = () => ok();
			img.onerror = () => fail(new Error("No se pudo cargar la ilustración"));
			img.src = url;
		});
		return img;
	} finally {
		URL.revokeObjectURL(url);
	}
};

			});
			const chunks = [];
			recorder.ondataavailable = (e) => {
				if (e.data.size) chunks.push(e.data);
			};
			recorder.onstop = () => {
				stream?.getTracks().forEach((t) => t.stop());
				exporting = false;
				download.disabled = false;
				replay.disabled = false;
				if (!active) return;
				const blob = new Blob(chunks, { type: mime });
				const url = URL.createObjectURL(blob);
				const a = document.createElement("a");
				a.href = url;
				a.download = "Mily-El-primer-golpe." + (mime.includes("mp4") ? "mp4" : "webm");
				a.click();
				window.setTimeout(() => URL.revokeObjectURL(url), 3e4);
				status.textContent = "Vídeo exportado. Mily está lista para compartir.";
			};
			recorder.onerror = () => {
				stream?.getTracks().forEach((t) => t.stop());
				exporting = false;
				download.disabled = false;
				replay.disabled = false;
				status.textContent = "La exportación falló. Puedes volver a intentarlo.";
			};
			exporting = true;
			download.disabled = true;
			replay.disabled = true;
			inicio = performance.now();
			recorder.start();
			status.textContent = "Grabando los 15 segundos del tráiler… Mantén esta pestaña visible.";
		} catch {
			stream?.getTracks().forEach((t) => t.stop());
			status.textContent = "No se pudo iniciar la grabación en este navegador.";
		}
	};
}

const modal=document.getElementById("modal");const open=()=>abrirTrailer(modal,()=>{modal.dispatchEvent(new Event("cerrar-trailer"));modal.hidden=true;});document.getElementById("open").onclick=open;document.addEventListener("keydown",e=>{if(e.key==="Escape"){modal.dispatchEvent(new Event("cerrar-trailer"));modal.hidden=true;}});open();</script></body></html>
